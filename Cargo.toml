[package]
name = "sechat-rs"
description = "A TUI based chat client for Nextcloud Talk"
readme = "README.md"
license-file = "LICENSE"
version = "0.1.1"
edition = "2018"
categories = ["command-line-utilities"]
keywords = ["tui", "nextcloud", "nextcloud-talk"]
authors = ["tofu <sechat@tofuli.de>"]
documentation = "https://docs.rs/sechat-rs/latest/sechat-rs/"
repository = "https://github.com/tofubert/sechat-rs"
homepage = "https://crates.io/crates/sechat-rs"
exclude = [
  "assets/*",
  ".github",
  "Makefile.toml",
  "CONTRIBUTING.md",
  "*.log",
  "tags",
]
[[bin]]
name = "sechat-rs"
path = "src/main.rs"


[dev-dependencies]
mockall = { version = "=0.15.0" }
mockall_derive = { version = "=0.15.0"}
tempfile = "=3.27.0"



[dependencies]
reqwest = { version = "=0.13.4", features = ["json"] }
tokio = { version = "=1.53.1", features = ["full"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
jzon = "=0.12.5"
base64 = "=0.23.1"
toml = "=1.1.4"
toml-example = "=0.17.0"
ratatui = {version = "=0.30.2", features = ["serde"] }
ratatui-textarea = "=0.9.2"
crossterm = "=0.29.0"
tui-tree-widget = "=0.24"
futures = "=0.3.34"
chrono = "=0.4.45"
num-traits = "=0.2.19"
num-derive = "=0.5.1"
log = "=0.4.33"
notify-rust = "=4.18"
itertools = "=0.15.0"
clap = { version = "=4.6.6", features = ["derive"] }
strum = "=0.28.0"
strum_macros = "=0.28.0"
textwrap = "=0.16.2"
etcetera = "=0.11.0"
better-panic = "=0.3.0"
color-eyre = "=0.6.5"
human-panic = "=2.0.8"
libc = "=0.2.189"
strip-ansi-escapes = "=0.2.1"
tracing = "=0.1.44"
cfg-if = "=1.0.4"
async-trait = "=0.1.92"
serde_with = "=3.22.0"
tokio-util = "=0.7.19"
tui-logger = { version = "=0.18.3", features = ["crossterm" ] }
colorhash = "0.1.3"
# Fix Vuln
tracing-subscriber = "0.3.23"


[workspace.lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { priority = -1, level = "deny" }

[profile.release]
# Disable debug information.
debug = false

# Strip symbols from the binary
strip = true

# Enable link time optimization (LTO) to remove dead code
lto = true

# Improve size optimization over build time
codegen-units = 1

# Disable debug assertions.
debug-assertions = false

# Disable overflow checks.
overflow-checks = false

# Disable rpath.
rpath = false
